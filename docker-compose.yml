# ============================================
# docker-compose.yml
# Multi-node Docker Compose configuration
# ============================================

version: '3.8'

services:
  # vLLM Server (single node)
  vllm:
    image: vllm/vllm-openai:latest
    command: --model Qwen/Qwen3-0.6B --block-size 16 --port 8000
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./models:/root/.cache/huggingface
    networks:
      - llm-network

  # Load Generator
  loadgen:
    build:
      context: .
      dockerfile: Dockerfile.multinode
    command: /app/benchmarks/build/loadgen http://vllm:8000/generate 50 10 60
    depends_on:
      - vllm
    environment:
      - CUDA_VISIBLE_DEVICES=""
    volumes:
      - ./artifacts:/app/artifacts
    networks:
      - llm-network

  # NCCL Simulator (multi-node simulation)
  nccl-sim:
    build:
      context: .
      dockerfile: Dockerfile.multinode
    command: python3 scripts/run_simulation.py --nodes 2 --gpus-per-node 4 --iterations 50
    environment:
      - CUDA_VISIBLE_DEVICES=""
    volumes:
      - ./artifacts:/app/artifacts
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge