version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:latest
    command: --model Qwen/Qwen3-0.6B --block-size 16 --port 8000
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - llm-network

  loadgen:
    build:
      context: .
      dockerfile: Dockerfile.multinode
    command: /app/benchmarks/build/loadgen http://vllm:8000/generate 50 10 60
    depends_on:
      - vllm
    volumes:
      - ./artifacts:/app/artifacts
    networks:
      - llm-network

  nccl-sim:
    build:
      context: .
      dockerfile: Dockerfile.multinode
    command: python3 scripts/run_simulation.py --nodes 2 --gpus-per-node 4
    volumes:
      - ./artifacts:/app/artifacts
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge